# XcodeGen spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open StockWatch.xcodeproj.
name: StockWatch
options:
  bundleIdPrefix: com.przemekzajac
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345   # your Apple Team ID, or pick it in Xcode > Signing & Capabilities

targets:
  StockWatch:
    type: application
    platform: watchOS
    sources:
      - path: StockWatch
    info:
      path: StockWatch/Info.plist
      properties:
        CFBundleDisplayName: StockWatch
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.przemekzajac.StockWatch.watchkitapp
        PRODUCT_NAME: StockWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
